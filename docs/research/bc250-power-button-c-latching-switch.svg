<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title>Way (c): a latching switch on PS_ON, with no solder</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111111" text-anchor="start">Way (c): a latching switch on PS_ON, with no solder</text>
<rect x="20" y="150" width="90" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="28" y="168" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Mains</text>
<text x="28" y="184" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">socket</text>
<polyline points="110,172 150,172" fill="none" stroke="#111111" stroke-width="2"/>
<text x="112" y="164" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">lead</text>
<rect x="150" y="90" width="215" height="165" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="158" y="108" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Power supply (ATX)</text>
<text x="158" y="124" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">EVGA SuperNOVA 1000 P5</text>
<text x="158" y="140" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="156" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Rear face: C14 inlet and</text>
<text x="158" y="172" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">rocker switch (full off)</text>
<text x="158" y="188" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="204" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">VGA socket  -&gt;</text>
<text x="158" y="220" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="236" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">MB sockets  -&gt;</text>
<polyline points="365,191 410,191 410,110 530,110" fill="none" stroke="#b00020" stroke-width="3"/>
<text x="380" y="80" font-size="12" font-weight="normal" fill="#b00020" text-anchor="start">PCIe 6+2 lead: 12 V</text>
<rect x="530" y="60" width="350" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="538" y="78" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">BC-250 (compute module)</text>
<text x="538" y="94" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">J1000: 8-pin, 12 V and ground</text>
<text x="538" y="110" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">AUTO_PWRON1: pins 1-2 (start when 12 V arrives)</text>
<circle cx="530" cy="110" r="4" fill="#b00020"/>
<text x="538" y="128" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">No wire to the board except the 12 V lead</text>
<polyline points="365,223 400,223 400,300 410,300" fill="none" stroke="#111111" stroke-width="2"/>
<text x="318" y="290" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">24-pin lead</text>
<rect x="410" y="275" width="245" height="70" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="418" y="293" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Plug on the 24-pin end</text>
<text x="418" y="309" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">PS_ON (pin 16) and ground (pin 15)</text>
<text x="418" y="325" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">go to the switch, no bridge</text>
<polyline points="655,300 720,300 720,370" fill="none" stroke="#1a4fb0" stroke-width="2"/>
<polyline points="655,320 700,320 700,370" fill="none" stroke="#1a4fb0" stroke-width="2"/>
<text x="728" y="340" font-size="12" font-weight="normal" fill="#1a4fb0" text-anchor="start">2 wires, about 1 m</text>
<rect x="620" y="370" width="260" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="628" y="388" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Latching switch (stays closed)</text>
<text x="628" y="404" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">on a fixed part of the shell</text>
<text x="20" y="395" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Switch closed: the supply runs and the board starts.</text>
<text x="20" y="413" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Switch open: 12 V goes off at once. Shut the system down first.</text>
<text x="20" y="431" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">With the switch open the supply is in standby.</text>
</svg>
