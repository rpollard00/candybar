<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title>Way (b): an adapter board that reads the host-on signal and switches PS_ON</title>
<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111111" text-anchor="start">Way (b): an adapter board that reads the host-on signal and switches PS_ON</text>
<rect x="20" y="150" width="90" height="44" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="28" y="168" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Mains</text>
<text x="28" y="184" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">socket</text>
<polyline points="110,172 150,172" fill="none" stroke="#111111" stroke-width="2"/>
<text x="112" y="164" font-size="11" font-weight="normal" fill="#666666" text-anchor="start">lead</text>
<rect x="150" y="90" width="215" height="165" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="158" y="108" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Power supply (ATX)</text>
<text x="158" y="124" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">EVGA SuperNOVA 1000 P5</text>
<text x="158" y="140" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="156" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">Rear face: C14 inlet and</text>
<text x="158" y="172" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">rocker switch (full off)</text>
<text x="158" y="188" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="204" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">VGA socket  -&gt;</text>
<text x="158" y="220" font-size="13" font-weight="normal" fill="#111111" text-anchor="start"></text>
<text x="158" y="236" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">MB sockets  -&gt;</text>
<polyline points="365,191 410,191 410,110 530,110" fill="none" stroke="#b00020" stroke-width="3"/>
<text x="380" y="80" font-size="12" font-weight="normal" fill="#b00020" text-anchor="start">PCIe 6+2 lead: 12 V</text>
<rect x="530" y="60" width="350" height="150" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="538" y="78" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">BC-250 (compute module)</text>
<text x="538" y="94" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">J1000: 8-pin, 12 V and ground</text>
<text x="538" y="110" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">AUTO_PWRON1: pins 1-2 (start when 12 V arrives)</text>
<circle cx="530" cy="110" r="4" fill="#b00020"/>
<text x="538" y="128" font-size="12" font-weight="normal" fill="#1a4fb0" text-anchor="start">TPMS1 pin 9: 3 V only when the board is on</text>
<text x="538" y="144" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">Alternative: 12 V pin of CPU_FAN1. Never the two.</text>
<text x="538" y="160" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">Optional: BTN_OUT to the button pad (solder)</text>
<polyline points="365,223 385,223 385,300 410,300" fill="none" stroke="#111111" stroke-width="2"/>
<text x="292" y="290" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">24-pin lead</text>
<rect x="410" y="262" width="230" height="112" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="418" y="280" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Adapter board</text>
<text x="418" y="296" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">5V_STB  &lt;- pin 9 (standby 5 V)</text>
<text x="418" y="312" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">PS_ON   -&gt; pin 16</text>
<text x="418" y="328" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">GND     -- pin 3</text>
<text x="418" y="344" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">HOST_ON &lt;- from the board</text>
<text x="418" y="360" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">BTN+, BTN-, LED+, LED-</text>
<polyline points="640,334 668,334 668,210" fill="none" stroke="#1a4fb0" stroke-width="2"/>
<circle cx="668" cy="210" r="4" fill="#1a4fb0"/>
<text x="674" y="232" font-size="12" font-weight="normal" fill="#1a4fb0" text-anchor="start">1 signal wire, no solder</text>
<polyline points="640,318 850,318 850,210" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/>
<text x="700" y="312" font-size="12" font-weight="normal" fill="#666666" text-anchor="start">BTN_OUT (optional)</text>
<polyline points="560,374 560,400 640,400" fill="none" stroke="#1b7a2f" stroke-width="2"/>
<polyline points="600,374 600,416 640,416" fill="none" stroke="#1b7a2f" stroke-width="2"/>
<text x="430" y="420" font-size="12" font-weight="normal" fill="#1b7a2f" text-anchor="start">4 wires: button and LED</text>
<rect x="640" y="384" width="240" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="648" y="402" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Momentary button with LED</text>
<text x="648" y="418" font-size="13" font-weight="normal" fill="#111111" text-anchor="start">on a fixed part of the shell</text>
<text x="20" y="395" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">Press: PS_ON low, 12 V arrives, the board starts.</text>
<text x="20" y="413" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">The system shuts down: host-on goes low,</text>
<text x="20" y="431" font-size="12" font-weight="normal" fill="#111111" text-anchor="start">the adapter releases PS_ON, the supply goes to standby.</text>
</svg>
